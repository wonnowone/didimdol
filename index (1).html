<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>희망디딤돌 — 취업을 위한 디딤돌</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --void:#0A0A0F; --cliff:#141420; --cliff-2:#1C1C2A;
  --lamp:#FFF4E0; --lamp-dim:#D8CDB4; --muted:#6B6B7A; --muted-2:#8A8A9A;
  --danger:#E08A7A;
  --display:'Gowun Batang',serif; --ui:'IBM Plex Sans KR',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:#000;color:var(--lamp);font-family:var(--ui);font-weight:300;
  display:flex;align-items:center;justify-content:center;overflow:hidden;-webkit-font-smoothing:antialiased}
#app{width:100%;max-width:1000px;height:100%;max-height:660px;position:relative;background:var(--void);overflow:hidden}
.screen{position:absolute;inset:0;display:none;flex-direction:column;padding:30px}
.screen.on{display:flex}
h1{font-family:var(--display);font-weight:400;font-size:36px;letter-spacing:.02em}
h2{font-family:var(--display);font-weight:400;font-size:30px}
.sub{color:var(--muted-2);font-size:14px;line-height:1.9}
.tiny{color:var(--muted);font-size:12px}
button{font-family:var(--ui);font-size:14px;color:var(--lamp);background:transparent;
  border:1px solid rgba(255,244,224,.28);padding:11px 26px;border-radius:2px;cursor:pointer;
  transition:background .25s,border-color .25s}
button:hover:not(:disabled){background:rgba(255,244,224,.07);border-color:rgba(255,244,224,.55)}
button:focus-visible,input:focus-visible{outline:2px solid var(--lamp);outline-offset:3px}
.primary{background:var(--lamp);color:var(--void);border-color:var(--lamp);font-weight:500}
.primary:hover{background:#fff}
.ghost{border-color:transparent;color:var(--muted-2)}
.ghost:hover{background:transparent;color:var(--lamp)}
.center{align-items:center;justify-content:center;text-align:center}
.row{display:flex;gap:10px;align-items:center}

/* login */
.slogan{font-size:15px;letter-spacing:.28em;color:#E8DCC4;margin-bottom:10px;font-weight:400}
.slogan em{font-style:normal;color:var(--lamp);font-weight:500}
.slogan::after{content:'';display:block;width:46px;height:1px;background:rgba(255,244,224,.35);margin:12px auto 0}
.spot{width:340px;height:265px;position:relative;display:flex;align-items:flex-end;justify-content:center}
.beam{position:absolute;top:0;left:50%;transform:translateX(-50%);width:0;height:0;
  border-left:80px solid transparent;border-right:80px solid transparent;
  border-top:220px solid rgba(255,244,224,.07);filter:blur(14px)}
.pool{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);width:210px;height:44px;
  border-radius:50%;background:radial-gradient(ellipse,rgba(255,244,224,.16),transparent 70%)}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-1.5deg)}50%{transform:translateY(-14px) rotate(1.5deg)}}
@keyframes glow{0%,100%{filter:drop-shadow(0 -6px 16px rgba(255,244,224,.25))}
                50%{filter:drop-shadow(0 -8px 30px rgba(255,244,224,.55))}}
@keyframes poolPulse{0%,100%{opacity:.7;transform:translateX(-50%) scale(1)}
                     50%{opacity:1;transform:translateX(-50%) scale(1.1)}}
.rockchar{position:relative;width:220px;height:auto;margin-bottom:14px;
  animation:bob 3.6s ease-in-out infinite, glow 3.6s ease-in-out infinite}
.pool{animation:poolPulse 3.6s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){.rockchar,.pool{animation:none}}
.charnote{position:absolute;bottom:-4px;left:50%;transform:translateX(-50%);
  font-size:10px;color:#3A3A48;white-space:nowrap}
input[type=text]{background:transparent;border:none;border-bottom:1px solid rgba(255,244,224,.28);
  color:var(--lamp);font-family:var(--display);font-size:20px;padding:9px 4px;width:240px;text-align:center}
input[type=text]::placeholder{color:#3A3A48;font-family:var(--ui);font-size:15px}

/* hub */
.topbar{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);z-index:3}
.canyon{flex:1;position:relative;margin:8px -30px 0}
.hubmsg{text-align:center;font-family:var(--display);font-size:16px;color:var(--muted-2);
  padding:14px 0 4px;transition:color 1s}
@keyframes breathe{0%,100%{opacity:.55}50%{opacity:1}}
.pulse{animation:breathe 2.8s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){.pulse{animation:none}}

/* rules */
.rulelist{list-style:none;margin:20px 0 28px;max-width:420px}
.rulelist{max-width:520px}
.rulelist li{color:#EDE3CE;font-size:17px;line-height:2.15;text-align:left;padding-left:24px;position:relative;font-weight:300}
.rulelist li::before{content:'·';position:absolute;left:6px;color:var(--lamp);font-size:20px;line-height:1.9}
.rulelist li b{color:#FFF4E0;font-weight:500}
#count{font-family:var(--display);font-size:110px}

/* game shell */
#game{padding:0}
.hud{position:absolute;top:0;left:0;right:0;height:50px;padding:0 24px;display:flex;
  align-items:center;justify-content:space-between;z-index:6;font-size:13px;color:var(--muted-2)}
.clock{font-family:var(--display);font-size:19px;color:var(--lamp)}
.hearts{letter-spacing:5px;font-size:15px}
.arena{position:absolute;inset:50px 0 0 0;overflow:hidden}
.float{position:absolute;font-family:var(--display);font-size:19px;pointer-events:none;
  animation:rise 1s ease-out forwards;z-index:9}
@keyframes rise{to{transform:translateY(-44px);opacity:0}}
.bar{width:170px;height:4px;background:rgba(255,244,224,.14);display:inline-block;vertical-align:middle}
.bar>i{display:block;height:100%;background:var(--lamp);transition:width .12s,background .3s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.shaking{animation:shake .3s}

/* g1 */
#dogWrap{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
#dog{font-size:230px;line-height:1;user-select:none;
  filter:drop-shadow(0 -10px 26px rgba(255,244,224,.28))}
#faceBubble{position:absolute;top:9%;left:50%;transform:translateX(-50%);font-size:52px}
.g1beam{position:absolute;top:0;left:50%;transform:translateX(-50%);width:0;height:0;
  border-left:130px solid transparent;border-right:130px solid transparent;
  border-top:100%px solid transparent}
.g1pool{position:absolute;bottom:6%;left:50%;transform:translateX(-50%);width:340px;height:70px;
  border-radius:50%;background:radial-gradient(ellipse,rgba(255,244,224,.15),transparent 70%)}
.keyhint{position:absolute;bottom:16px;left:50%;transform:translateX(-50%);font-size:15px;color:#B9AE97;letter-spacing:.08em}
.legendbar{position:absolute;right:18px;bottom:14px;font-size:13px;color:#8A8272;line-height:1.9;text-align:right}

/* g2 bright */
#g2root{position:absolute;inset:0;background:#FDF6E8;color:#4A3A22;opacity:0;transition:opacity .8s}
#g2root .line{position:absolute;left:6%;right:6%;height:2px;background:#C9A227;opacity:.6}
#g2root .window{position:absolute;left:6%;right:6%;background:rgba(201,162,39,.1);border-top:1px dashed rgba(201,162,39,.5);border-bottom:1px dashed rgba(201,162,39,.5)}
#g2bread{position:absolute;left:50%;font-size:120px;transform:translateX(-50%);will-change:top}
.hand{position:absolute;font-size:104px;transition:transform .32s cubic-bezier(.2,.8,.3,1),opacity .3s;
  filter:drop-shadow(0 6px 10px rgba(90,60,20,.35));z-index:4}

/* g3 */
#g3root{position:absolute;inset:0;background:#20242E;overflow:hidden}
.laneline{position:absolute;left:0;right:0;height:2px;background:rgba(255,255,255,.05)}
.obj{position:absolute;border-radius:10px;display:flex;align-items:center;justify-content:center;
  font-size:26px;will-change:transform}
.warn{position:absolute;top:0;height:5px;background:#E05A4A;opacity:.85;border-radius:3px}
#lift{position:absolute;width:82px;height:96px}

/* ending / rank */
.scorelist{margin:22px 0;width:340px}
.scorerow{display:flex;justify-content:space-between;padding:11px 0;
  border-bottom:1px solid rgba(255,244,224,.09);font-size:14px}
.scorerow b{font-family:var(--display);font-weight:400;font-size:18px}
.total{display:flex;justify-content:space-between;padding-top:14px}
.total b{font-family:var(--display);font-weight:400;font-size:30px}
.rankbig{font-family:var(--display);font-size:62px}
.msgbox{max-width:440px;font-size:13px;color:var(--muted-2);line-height:2;margin-top:20px;
  border-top:1px solid rgba(255,244,224,.11);padding-top:18px}
table{border-collapse:collapse;width:100%;max-width:500px;font-size:13px}
th{color:var(--muted);font-weight:400;text-align:right;padding:9px 8px;font-size:11px;
  letter-spacing:.08em;border-bottom:1px solid rgba(255,244,224,.15)}
td{padding:10px 8px;text-align:right;border-bottom:1px solid rgba(255,244,224,.06);color:var(--lamp-dim)}
th:first-child,td:first-child{text-align:left}
tr.me td{color:var(--lamp)}
.scrollwrap{max-height:310px;overflow-y:auto;width:100%;display:flex;justify-content:center}
#flash{position:absolute;inset:0;background:#FFF4E0;opacity:0;pointer-events:none;z-index:20;transition:opacity 1.4s}
</style>
</head>

<script type="module">
/* ===================================================================
   Firebase 연결
   아래 FIREBASE_CONFIG 에 콘솔에서 받은 값을 붙여넣으면 서버 모드로 동작합니다.
   비워두면 로컬 모의 데이터로 동작합니다 (개발용).
=================================================================== */
const FIREBASE_CONFIG = {
  // apiKey: "",
  // authDomain: "",
  // projectId: "",
  // storageBucket: "",
  // messagingSenderId: "",
  // appId: ""
};

const CONFIGURED = !!FIREBASE_CONFIG.projectId;
window.FB = { ready:false, configured:CONFIGURED, error:null };

if (CONFIGURED) {
  try {
    const { initializeApp } = await import('https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js');
    const { getAuth, signInAnonymously, onAuthStateChanged } =
      await import('https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js');
    const { getFirestore, doc, getDoc, setDoc, updateDoc, collection,
            query, orderBy, limit, onSnapshot, serverTimestamp } =
      await import('https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js');

    const app  = initializeApp(FIREBASE_CONFIG);
    const auth = getAuth(app);
    const db   = getFirestore(app);

    const uid = await new Promise((res, rej) => {
      onAuthStateChanged(auth, u => u && res(u.uid));
      signInAnonymously(auth).catch(rej);
    });

    let unsub = null;

    window.FB = {
      ready:true, configured:true, error:null, uid,

      /* 로그인: 문서가 없으면 생성, 있으면 기존 기록 반환 */
      async login(name){
        const ref = doc(db,'players',name);
        const snap = await getDoc(ref);
        if (!snap.exists()) {
          const fresh = { name, ownerUid:uid,
            scores:{game1:null,game2:null,game3:null},
            total:0, unlocked:1, completed:false,
            createdAt:serverTimestamp(), updatedAt:serverTimestamp() };
          await setDoc(ref, fresh);
          return { ...fresh, mine:true };
        }
        const d = snap.data();
        return { ...d, mine: d.ownerUid === uid };
      },

      /* 점수 제출 */
      async submit(name, gameIndex, score){
        const ref  = doc(db,'players',name);
        const snap = await getDoc(ref);
        if (!snap.exists()) throw new Error('플레이어 문서가 없습니다');
        const d  = snap.data();
        const key = 'game' + (gameIndex + 1);
        if (d.scores[key] != null) return d;          // 1회 제한
        const scores = { ...d.scores, [key]: score };
        const total = Math.round(
          (['game1','game2','game3'].reduce((a,k)=>a+(scores[k]||0),0)) * 10) / 10;
        const unlocked  = Math.min(3, Math.max(d.unlocked, gameIndex + 2));
        const completed = scores.game1!=null && scores.game2!=null && scores.game3!=null;
        await updateDoc(ref, { scores, total, unlocked, completed, updatedAt:serverTimestamp() });
        return { ...d, scores, total, unlocked, completed };
      },

      /* 실시간 순위 구독 */
      onRanking(cb){
        this.offRanking();
        const q = query(collection(db,'players'), orderBy('total','desc'), limit(50));
        unsub = onSnapshot(q, snap => cb(snap.docs.map(x=>x.data())),
                                err => console.warn('ranking', err));
      },
      offRanking(){ if(unsub){ unsub(); unsub=null; } }
    };
  } catch (e) {
    window.FB = { ready:false, configured:true, error:e.message };
    console.error('Firebase 초기화 실패:', e);
  }
}
window.dispatchEvent(new Event('fb-ready'));
</script>

    LIVE=rows.map(function(r){return {name:r.name,total:r.total,completed:r.completed};});

var SEED=[{name:'서준',total:128},{name:'하윤',total:117},{name:'도현',total:104},
 {name:'지우',total:96},{name:'예린',total:89},{name:'민재',total:81},
 {name:'수아',total:73},{name:'건우',total:64},{name:'다인',total:55}];

/* ================= 유틸 ================= */
function show(id){var e=document.querySelectorAll('.screen');
  for(var i=0;i<e.length;i++)e[i].classList.remove('on');
  document.getElementById(id).classList.add('on');}
function fmt(ms){var t=Math.max(0,ms),m=Math.floor(t/60000),s=Math.floor(t%60000/1000),d=Math.floor(t%1000/100);
  return (m<10?'0':'')+m+':'+(s<10?'0':'')+s+'.'+d;}
var arena=document.getElementById('arena'),clockEl=document.getElementById('clock');
var hudMid=document.getElementById('hudMid'),hudRight=document.getElementById('hudRight');

/* ================= 로그인 ================= */
var nameInput=document.getElementById('nameInput');
document.getElementById('startBtn').onclick=function(){
  var n=nameInput.value.trim();
  if(!n){document.getElementById('loginNote').textContent='이름을 입력해주세요';nameInput.focus();return;}

    document.getElementById('loginNote').textContent='기록을 불러오는 중…';

/* ================= 허브 ================= */

var G={t0:0,live:false,raf:0,cleanup:null,bonus:0};
function elapsed(){return performance.now()-G.t0;}
function hearts(n){var s='';for(var i=0;i<3;i++)s+=i<n?'♥':'♡';hudRight.innerHTML='<span class="hearts">'+s+'</span>';}

  arena.appendChild(f);setTimeout(function(){f.remove();},1000);

function tick(){if(!G.live)return;clockEl.textContent=fmt(elapsed());G.raf=requestAnimationFrame(tick);}
function startGame(i){
  arena.innerHTML='';hudMid.textContent='';hudRight.textContent='';

function endGame(i){
  G.live=false;cancelAnimationFrame(G.raf);
  if(G.cleanup){G.cleanup();G.cleanup=null;}
  var sec=elapsed()/1000, score=Math.round(sec*10)/10+G.bonus;
  score=Math.round(score*10)/10;
  S.scores[i]=score;S.cleared=i+1;

   '<div style="font-family:var(--display);font-size:56px">'+score+'<span style="font-size:18px">점</span></div>'+
   '<button class="primary" id="afterBtn" style="margin-top:12px">길로 돌아가기</button></div>';

}

/* ================= 게임 1 : 반려견 (반대 방향 빗질) ================= */
var LOOK={ArrowLeft:{op:'ArrowRight',deg:270},ArrowRight:{op:'ArrowLeft',deg:90},
          ArrowUp:{op:'ArrowDown',deg:0},ArrowDown:{op:'ArrowUp',deg:180}};
var DIRS=['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'];
var BRUSH_SVG='<svg viewBox="0 0 90 70" width="120" height="94">'+
 '<rect x="12" y="6" width="66" height="26" rx="9" fill="#8A5A32"/>'+
 '<rect x="20" y="12" width="50" height="8" rx="4" fill="#A97243"/>'+
 '<g stroke="#F2E6D0" stroke-width="4" stroke-linecap="round">'+
 '<line x1="20" y1="32" x2="20" y2="56"/><line x1="30" y1="32" x2="30" y2="60"/>'+
 '<line x1="40" y1="32" x2="40" y2="62"/><line x1="50" y1="32" x2="50" y2="62"/>'+
 '<line x1="60" y1="32" x2="60" y2="60"/><line x1="70" y1="32" x2="70" y2="56"/></g></svg>';
function g1(){
  arena.innerHTML='<div class="g1pool"></div>'+
    '<div id="gazeCone" style="position:absolute;opacity:0;width:0;height:0;pointer-events:none"></div>'+
    '<div id="dogWrap"><div id="dog" style="transition:transform .22s cubic-bezier(.3,1.3,.5,1)">🐕</div></div>'+
    '<div id="brush" style="position:absolute;opacity:0;left:50%;top:50%;margin:-47px 0 0 -60px;'+
      'transition:transform .22s ease-out,opacity .18s;z-index:5">'+BRUSH_SVG+'</div>'+
    '<div class="keyhint">보는 쪽의 <b style="color:#FFF4E0">반대</b>를 계속 두드리세요 · 개가 돌면 바로 바꾸세요</div>';
  var dog=document.getElementById('dog'),cone=document.getElementById('gazeCone'),brush=document.getElementById('brush');
  var look=null,lives=3,turnAt=0,graceUntil=0,idleAt=0,strokes=0;
  hearts(3);
  function params(){
    var s=Math.floor(elapsed()/1000/10);
    return {turn:Math.max(950,2200*Math.pow(.88,s)),    // 방향 유지 시간
            grace:Math.max(280,520*Math.pow(.94,s)),    // 전환 직후 봐주는 시간
            idle:Math.max(900,1500*Math.pow(.95,s))};   // 손 놓으면 안 되는 시간
  }
  function setGaze(){
    var tf={ArrowLeft:'rotate(-10deg) translateX(-30px)',
            ArrowRight:'scaleX(-1) rotate(-10deg) translateX(-30px)',
            ArrowUp:'rotate(-26deg) translateY(-22px)',
            ArrowDown:'rotate(24deg) translateY(20px)'};
    dog.style.transform=tf[look];
    var C={ArrowLeft :{l:'16%',t:'38%',b:'border-right:150px solid rgba(255,244,224,.22);border-top:70px solid transparent;border-bottom:70px solid transparent'},
           ArrowRight:{l:'62%',t:'38%',b:'border-left:150px solid rgba(255,244,224,.22);border-top:70px solid transparent;border-bottom:70px solid transparent'},
           ArrowUp   :{l:'40%',t:'4%', b:'border-bottom:140px solid rgba(255,244,224,.22);border-left:70px solid transparent;border-right:70px solid transparent'},
           ArrowDown :{l:'40%',t:'64%',b:'border-top:140px solid rgba(255,244,224,.22);border-left:70px solid transparent;border-right:70px solid transparent'}}[look];
    cone.setAttribute('style','position:absolute;pointer-events:none;width:0;height:0;'+
      'left:'+C.l+';top:'+C.t+';opacity:1;filter:blur(11px);'+C.b);
  }
  function turn(){
    var n;do{n=DIRS[Math.floor(Math.random()*4)];}while(n===look);
    look=n;setGaze();
    var p=params(),now=performance.now();
    graceUntil=now+p.grace;          // 연타 중이었어도 이 동안은 봐준다
    turnAt=now+p.turn+Math.random()*p.turn*0.35;
    idleAt=now+p.idle+p.grace;
    dog.style.filter='drop-shadow(0 0 26px rgba(255,244,224,.45))';
    setTimeout(function(){if(G.live)dog.style.filter='';},220);
  }
  function brushIn(dir){
    var f={ArrowLeft:{x:-320,y:0,r:90},ArrowRight:{x:320,y:0,r:-90},
           ArrowUp:{x:0,y:-300,r:180},ArrowDown:{x:0,y:300,r:0}}[dir];
    brush.style.transition='none';
    brush.style.transform='translate('+f.x+'px,'+f.y+'px) rotate('+f.r+'deg)';
    brush.style.opacity='1';void brush.offsetWidth;
    brush.style.transition='transform .2s ease-out,opacity .18s .18s';
    brush.style.transform='translate('+(f.x*0.2)+'px,'+(f.y*0.2)+'px) rotate('+f.r+'deg)';
    brush.style.opacity='0';
  }
  function fail(msg){
    lives--;hearts(lives);floatText(msg,'#E08A7A',44);
    arena.classList.add('shaking');setTimeout(function(){arena.classList.remove('shaking');},300);
    if(lives<=0){cleanup();endGame(0);return;}
    turn();                     // 실수하면 방향을 새로 준다
  }
  function hud(){
    hudMid.innerHTML='<span style="font-size:13px;color:#8A8A9A">빗질 '+strokes+'회</span>';
  }
  function press(k){
    var now=performance.now(),p=params();
    if(k===LOOK[look].op){
      strokes++;hud();brushIn(k);
      idleAt=now+p.idle;
      return;
    }
    if(now<graceUntil)return;       // 막 돌아본 직후의 관성 입력은 무시
    fail(k===look?'얼굴을 때렸어요':'엉뚱한 곳을 빗었어요');
  }
  function loop(now){
    if(!G.live)return;
    if(now>turnAt)turn();
    if(now>idleAt){idleAt=now+params().idle;fail('손을 멈췄어요');if(lives<=0)return;}
    requestAnimationFrame(loop);
  }
  function kd(e){if(e.key.indexOf('Arrow')===0){e.preventDefault();if(!e.repeat)press(e.key);}}
  function cleanup(){window.removeEventListener('keydown',kd);}
  window.addEventListener('keydown',kd);G.cleanup=cleanup;
  turn();hud();requestAnimationFrame(loop);
}

/* ================= 게임 2 : 제빵 ================= */
var BREADS=[{e:'🥐',k:'ArrowLeft'},{e:'🍞',k:'ArrowDown'},{e:'🥖',k:'ArrowRight'}];
var HAND_SVG='<svg viewBox="0 0 130 165" width="126" height="160">'+
 '<defs><linearGradient id="sk" x1="0" y1="0" x2="0" y2="1">'+
 '<stop offset="0%" stop-color="#F4CDA6"/><stop offset="100%" stop-color="#D9A87C"/></linearGradient></defs>'+
 '<g fill="url(#sk)" stroke="#B98A62" stroke-width="2.5" stroke-linejoin="round">'+
 '<rect x="16" y="72" width="17" height="46" rx="8.5" transform="rotate(-34 24 95)"/>'+
 '<rect x="37" y="28" width="17" height="64" rx="8.5" transform="rotate(-8 45 60)"/>'+
 '<rect x="57" y="20" width="17" height="72" rx="8.5"/>'+
 '<rect x="77" y="28" width="17" height="64" rx="8.5" transform="rotate(8 85 60)"/>'+
 '<rect x="96" y="44" width="15" height="50" rx="7.5" transform="rotate(16 103 68)"/>'+
 '<rect x="30" y="76" width="70" height="76" rx="26"/>'+
 '</g>'+
 '<path d="M50,104 q16,-8 32,0" stroke="#C79A72" stroke-width="2.5" fill="none" opacity=".55" stroke-linecap="round"/>'+
 '<path d="M46,120 q20,-7 40,2" stroke="#C79A72" stroke-width="2.5" fill="none" opacity=".45" stroke-linecap="round"/>'+
 '</svg>';
function g2(){
  arena.innerHTML='<div id="g2root"><div class="window" id="win"></div><div class="line" id="line"></div></div>';
  var root=document.getElementById('g2root');
  setTimeout(function(){root.style.opacity='1';},30);
  var H=arena.clientHeight,W=arena.clientWidth,LINE=H*0.68;
  document.getElementById('line').style.top=LINE+'px';
  var lives=3,items=[],last=0;
  hearts(3);hudMid.innerHTML='';
  function params(){
    var el=elapsed()/1000,s=Math.floor(el/6);
    return {fall:Math.max(380,1100*Math.pow(.84,s)),
            win:Math.max(120,300*Math.pow(.9,s)),
            gap:Math.max(150,900*Math.pow(.82,s)),
            max: el>36?3:(el>20?2:1)};
  }
  function drawWindow(){
    var p=params(),w=document.getElementById('win');
    var px=(p.win/p.fall)*(LINE+150);
    w.style.top=(LINE-px)+'px';w.style.height=(px*2)+'px';
  }
  function spawn(){
    var p=params(),b=BREADS[Math.floor(Math.random()*3)];
    var el=document.createElement('div');
    el.style.cssText='position:absolute;left:50%;transform:translateX(-50%);font-size:118px;top:-150px';
    el.textContent=b.e;root.appendChild(el);
    items.push({el:el,b:b,born:performance.now(),fall:p.fall,win:p.win});
    drawWindow();
  }
  function hit(msg){
    lives--;hearts(lives);floatText(msg,'#C0392B',44);
    root.classList.add('shaking');setTimeout(function(){root.classList.remove('shaking');},300);
    if(lives<=0){cleanup();endGame(1);return true;}
    return false;
  }
  function remove(it){it.el.remove();var i=items.indexOf(it);if(i>=0)items.splice(i,1);}
  function handAnim(dir){
    var h=document.createElement('div');h.className='hand';h.innerHTML=HAND_SVG;
    var base={ArrowLeft:{l:'-150px',t:(LINE-70)+'px',r:'rotate(90deg)',to:'translateX(210px) rotate(90deg)'},
              ArrowRight:{l:(W+30)+'px',t:(LINE-70)+'px',r:'rotate(-90deg)',to:'translateX(-210px) rotate(-90deg)'},
              ArrowDown:{l:'calc(50% - 60px)',t:(H+40)+'px',r:'rotate(0deg)',to:'translateY(-'+(H-LINE+120)+'px)'}}[dir];
    h.style.left=base.l;h.style.top=base.t;h.style.transform=base.r;h.style.transition='none';
    root.appendChild(h);void h.offsetWidth;
    h.style.transition='transform .26s cubic-bezier(.2,.9,.3,1)';
    h.style.transform=base.to;
    setTimeout(function(){h.style.transition='transform .3s ease-in,opacity .3s';
      h.style.transform=base.r;h.style.opacity='0';
      setTimeout(function(){h.remove();},320);},280);
  }
  function judge(key){
    if(!items.length)return;
    var it=items[0],diff=(performance.now()-it.born)-it.fall;
    if(Math.abs(diff)>it.win){remove(it);if(hit(diff<0?'너무 일러':'너무 늦어'))return;return;}
    if(key!==it.b.k){remove(it);if(hit('다른 빵'))return;return;}
    it.el.style.transition='opacity .18s,transform .18s';
    it.el.style.opacity='0';
    handAnim(key);floatText('좋아요','#1E8449',46);
    remove(it);
  }
  function loop(now){
    if(!G.live)return;
    var p=params();
    if(now-last>p.gap&&items.length<p.max){spawn();last=now;}
    for(var i=items.length-1;i>=0;i--){
      var it=items[i],prog=(now-it.born)/it.fall;
      it.el.style.top=(-150+prog*(LINE+150))+'px';
      if(now-it.born>it.fall+it.win){remove(it);if(hit('놓쳤어요'))return;}
    }
    requestAnimationFrame(loop);
  }
  function kd(e){if(e.key==='ArrowLeft'||e.key==='ArrowDown'||e.key==='ArrowRight'){e.preventDefault();judge(e.key);}}
  function cleanup(){window.removeEventListener('keydown',kd);}
  window.addEventListener('keydown',kd);G.cleanup=cleanup;
  spawn();last=performance.now();requestAnimationFrame(loop);
}

/* ================= 게임 3 : 지게차 ================= */
var LIFT_SVG='<svg viewBox="0 0 82 96" width="82" height="96">'+
 '<rect x="14" y="0" width="8" height="30" rx="2" fill="#5A5A62"/>'+
 '<rect x="60" y="0" width="8" height="30" rx="2" fill="#5A5A62"/>'+
 '<rect x="10" y="26" width="62" height="9" rx="3" fill="#8A8A94"/>'+
 '<rect x="18" y="34" width="46" height="10" rx="3" fill="#3E3E46"/>'+
 '<rect x="12" y="42" width="58" height="44" rx="7" fill="#F2B705" stroke="#8A6A00" stroke-width="3"/>'+
 '<rect x="22" y="50" width="38" height="20" rx="4" fill="#2E2E36"/>'+
 '<circle cx="41" cy="60" r="6" fill="#C9CBD4"/>'+
 '<rect x="6" y="48" width="8" height="16" rx="3" fill="#33333B"/>'+
 '<rect x="68" y="48" width="8" height="16" rx="3" fill="#33333B"/>'+
 '<rect x="8" y="72" width="8" height="14" rx="3" fill="#33333B"/>'+
 '<rect x="66" y="72" width="8" height="14" rx="3" fill="#33333B"/>'+
 '<rect x="24" y="86" width="34" height="6" rx="3" fill="#8A6A00"/></svg>';
function g3(){
  arena.innerHTML='<div id="g3root">'+
    '<div style="position:absolute;top:0;bottom:0;left:20%;width:2px;background:rgba(255,255,255,.09)"></div>'+
    '<div style="position:absolute;top:0;bottom:0;right:20%;width:2px;background:rgba(255,255,255,.09)"></div>'+
    '<div id="lift">'+LIFT_SVG+'</div></div>';
  var root=document.getElementById('g3root'),lift=document.getElementById('lift');
  var W=arena.clientWidth,H=arena.clientHeight;
  var lx=W/2-41,ly=H*0.70,LW=82,LH=96;
  var lives=3,inv=0,objs=[],warns=[],last=0,prev=performance.now(),loaded=0,missed=0;
  var keys={},minY=H*0.52,maxY=H-LH-10,PAD=W*0.2;
  hearts(3);
  function hudLoad(){
    var miss='';for(var i=0;i<5;i++)miss+=i<missed?'✕':'·';
    hudMid.innerHTML='<span style="font-size:13px">적재 '+loaded+' (+'+G.bonus+')'+
      ' &nbsp;&nbsp;<span style="color:'+(missed>=3?'#E08A7A':'#8A8A9A')+'">놓침 '+miss+'</span></span>';}
  hudLoad();
  function params(){
    var el=elapsed()/1000,s=Math.floor(el/8);
    return {speed:Math.min(780,340*Math.pow(1.15,s)),gap:Math.max(190,450*Math.pow(.9,s)),
            risk:Math.min(.88,.6+.06*s)};
  }
  function spawn(){
    var p=params(),danger=Math.random()<p.risk;
    var x=W*0.2+Math.random()*(W*0.6-52);
    if(danger){
      var w=document.createElement('div');w.className='warn';
      w.style.left=x+'px';w.style.width='56px';root.appendChild(w);
      warns.push(w);
      setTimeout(function(){w.remove();warns.splice(warns.indexOf(w),1);if(G.live)drop(x,true,p.speed);},300);
    } else drop(x,false,p.speed);
  }
  function drop(x,danger,speed){
    var el=document.createElement('div');el.className='obj';
    var DANGER=[
      {w:50,h:50,r:'2px',bg:'repeating-linear-gradient(45deg,#9A8F7A,#9A8F7A 7px,#7E7360 7px,#7E7360 14px)',bd:'#5E5648'},
      {w:58,h:34,r:'2px',bg:'linear-gradient(#8C8A7A,#6E6A5E)',bd:'#54503F'},
      {w:38,h:56,r:'4px',bg:'repeating-linear-gradient(0deg,#8E8778,#8E8778 6px,#767060 6px,#767060 12px)',bd:'#57523F'},
      {w:46,h:46,r:'3px',bg:'linear-gradient(135deg,#A39679,#7C755F)',bd:'#5B5544'}];
    var SAFE=[
      {w:50,h:50,r:'13px',bg:'#B79263',bd:'#8A6B44'},
      {w:60,h:36,r:'15px',bg:'#C3A276',bd:'#916F48'},
      {w:40,h:54,r:'14px',bg:'#AD8A5C',bd:'#82653F'},
      {w:52,h:44,r:'16px',bg:'#BE9A6C',bd:'#8B6C45'}];
    var k=(danger?DANGER:SAFE)[Math.floor(Math.random()*4)];
    el.style.width=k.w+'px';el.style.height=k.h+'px';el.style.borderRadius=k.r;
    el.style.background=k.bg;el.style.border='2px solid '+k.bd;
    el.style.left=x+'px';el.style.top='-58px';root.appendChild(el);
    objs.push({el:el,x:x,y:-58,d:danger,sp:speed,w:k.w,h:k.h});
  }
  function hit(){
    lives--;hearts(lives);inv=1000;
    root.classList.add('shaking');setTimeout(function(){root.classList.remove('shaking');},300);
    if(lives<=0){cleanup();endGame(2);return true;}
    return false;
  }
  function loop(now){
    if(!G.live)return;
    var dt=Math.min(50,now-prev);prev=now;
    var p=params();
    if(keys.ArrowLeft)lx-=420*dt/1000;
    if(keys.ArrowRight)lx+=420*dt/1000;
    if(keys.ArrowUp)ly-=420*dt/1000;
    if(keys.ArrowDown)ly+=420*dt/1000;
    lx=Math.max(PAD,Math.min(W-LW-PAD,lx));ly=Math.max(minY,Math.min(maxY,ly));
    lift.style.left=lx+'px';lift.style.top=ly+'px';
    if(inv>0){inv-=dt;lift.style.opacity=Math.floor(now/90)%2?'.3':'1';}else lift.style.opacity='1';
    if(now-last>p.gap&&objs.length<8){spawn();last=now;}

    var hx=lx+LW*.22,hw=LW*.56,hy=ly+LH*.34,hh=LH*.5;
    for(var i=objs.length-1;i>=0;i--){
      var o=objs[i];o.y+=o.sp*dt/1000;o.el.style.top=o.y+'px';
      var ox=o.x+o.w*.2,ow=o.w*.6,oh=o.h*.6;
      var overlap=ox+ow>hx&&ox<hx+hw&&o.y+o.h*.2+oh>hy&&o.y+o.h*.2<hy+hh;
      if(overlap){
        if(o.d){ if(inv<=0){o.el.remove();objs.splice(i,1);if(hit())return;continue;} }
        else{ o.el.remove();objs.splice(i,1);loaded++;G.bonus+=2;hudLoad();
              floatText('+2','#7ED9A0',(o.x/W*100));continue; }
      }
      if(o.y>H){
        if(!o.d){missed++;hudLoad();
          if(missed>=5){o.el.remove();objs.splice(i,1);cleanup();endGame(2);return;}
          floatText('놓쳤다','#E08A7A',(o.x/W*100));}
        o.el.remove();objs.splice(i,1);}
    }
    requestAnimationFrame(loop);
  }
  function kd(e){if(e.key.indexOf('Arrow')===0){e.preventDefault();keys[e.key]=true;}}
  function ku(e){keys[e.key]=false;}
  function cleanup(){window.removeEventListener('keydown',kd);window.removeEventListener('keyup',ku);}
  window.addEventListener('keydown',kd);window.addEventListener('keyup',ku);G.cleanup=cleanup;
  requestAnimationFrame(loop);
}

/* ================= 엔딩 ================= */
function total(){return Math.round(S.scores.reduce(function(a,b){return a+(b||0)},0)*10)/10;}
function openEnding(){
  var w=document.getElementById('scoreList');w.innerHTML='';
  GAMES.forEach(function(g,i){
    var d=document.createElement('div');d.className='scorerow';
    d.innerHTML='<span>'+g.icon+'  '+g.job+'</span><b>'+S.scores[i]+'</b>';w.appendChild(d);});
  var t=document.createElement('div');t.className='total';
  t.innerHTML='<span style="align-self:flex-end;color:var(--muted-2)">총점</span><b>'+total()+'</b>';
  w.appendChild(t);
  document.getElementById('revealArea').innerHTML='<button class="primary" id="rev">순위 확인</button>';
  document.getElementById('rev').onclick=reveal;
  document.getElementById('endMsg').style.display='none';
  show('ending');
}
function myRank(){
  var base=(LIVE&&LIVE.length)?LIVE.filter(function(r){return r.name!==S.name;}):SEED;
  var all=base.map(function(r){return {name:r.name,total:r.total};})
              .concat([{name:S.name,total:total(),me:true}]);
  all.sort(function(a,b){return b.total-a.total});
  for(var i=0;i<all.length;i++)if(all[i].me)return{rank:i+1,all:all};
  return{rank:all.length,all:all};
}
function reveal(){
  var r=myRank(),area=document.getElementById('revealArea');
  area.innerHTML='<div class="rankbig" id="rn">—</div><p class="tiny" id="rs" style="margin-top:6px"></p>';
  var el=document.getElementById('rn'),n=r.all.length,k=0;
  var iv=setInterval(function(){
    k++;
    if(k>=12){clearInterval(iv);el.textContent=r.rank+'위';
      var up=r.all[r.rank-2];
      document.getElementById('rs').textContent=r.rank===1?'가장 멀리 갔습니다':
        (up?up.name+'님과 '+Math.round((up.total-total())*10)/10+'점 차이':'');
      document.getElementById('endMsg').style.display='block';}
    else el.textContent=(Math.floor(Math.random()*n)+1)+'위';
  },70);
}
document.getElementById('toRank').onclick=function(){rankFrom='ending';paintRank();show('rank');};
document.getElementById('toMain').onclick=function(){
  S={name:'',cleared:0,scores:[null,null,null]};
  nameInput.value='';document.getElementById('loginNote').textContent='';
  document.getElementById('exitLight').style.opacity='0';
  document.getElementById('hubMsg').style.color='';
  show('login');serverBadge();nameInput.focus();
};
function paintRank(){
  var list;
  if(LIVE&&LIVE.length){
    list=LIVE.slice();
    for(var j=0;j<list.length;j++)if(list[j].name===S.name)list[j].me=true;
  } else {
    list=S.cleared===3?myRank().all:SEED.slice();
  }
  var h='<tr><th>순위</th><th>이름</th><th>총점</th></tr>';
  list.forEach(function(p,i){
    h+='<tr class="'+(p.me?'me':'')+'"><td>'+(i+1)+'</td><td style="text-align:right">'+p.name+'</td><td>'+p.total+'</td></tr>';});
  document.getElementById('rankTable').innerHTML=h;
}
document.getElementById('rankBack').onclick=function(){show(rankFrom==='login'?'login':'ending');};
serverBadge();subscribeRanking();
nameInput.focus();
</script>
</body>
